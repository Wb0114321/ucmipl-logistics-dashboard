// ==========================================
// LOAD DEMO DATA
// ==========================================

function loadData(){

    const tableBody =
    document.getElementById("tableBody");

    tableBody.innerHTML = "";

    demoData.forEach(item=>{

        const tr =
        document.createElement("tr");

        tr.innerHTML = `
            <td>${item.vehicle}</td>
            <td>${item.tareTime}</td>
            <td>${item.grossTime}</td>
            <td class="tat-cell">${item.tat}</td>
        `;

        tableBody.appendChild(tr);

    });

    document.getElementById("totalTrucks").innerText = "158";
    document.getElementById("totalGross").innerText = "147";
    document.getElementById("totalPending").innerText = "11";

}

// ==========================================
// LIVE CLOCK
// ==========================================

function updateClock(){

    const now = new Date();

    document.getElementById("liveDate").innerText =
    now.toLocaleDateString("en-IN",{
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
    });

    document.getElementById("liveTime").innerText =
    now.toLocaleTimeString("en-IN");

}

setInterval(updateClock,1000);

updateClock();

// ==========================================
